backend:
  name: git-gateway
  branch: main   # change to master if your default branch is named master

media_folder: "static/uploads"
public_folder: "/uploads"

site_url: https://YOUR-SITE.netlify.app   # will be updated after you get the Netlify URL

publish_mode: editorial_workflow   # optional – lets you review before publishing

collections:
  - name: "posts"
    label: "Grandma Updates"
    folder: "src/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Body", name: "body", widget: "markdown"}
